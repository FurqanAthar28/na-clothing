<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 100" role="img" aria-labelledby="title description">
  <title id="title">Koshishein</title>
  <desc id="description">Animated Koshishein wordmark with a brown gradient and wave passing through it.</desc>
  <defs>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f251c"/>
      <stop offset="0.42" stop-color="#71442d"/>
      <stop offset="0.7" stop-color="#a36a43"/>
      <stop offset="1" stop-color="#4d2f23"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d2f23"/>
      <stop offset="0.5" stop-color="#93603e"/>
      <stop offset="1" stop-color="#5d3726"/>
    </linearGradient>
    <style>
      .name { fill: url(#wordmark); font: 500 58px Georgia, 'Times New Roman', serif; letter-spacing: 9px; }
      .wave { fill: none; stroke: url(#accent); stroke-width: 2.25; stroke-linecap: round; stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 1100ms 450ms ease-out forwards; }
      .wordmark { opacity: 0; transform: translateY(12px); animation: reveal 700ms 100ms cubic-bezier(.16,1,.3,1) forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes reveal { to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) { .wave { stroke-dashoffset: 0; animation: none; } .wordmark { opacity: 1; transform: none; animation: none; } }
    </style>
  </defs>
  <g class="wordmark">
    <text class="name" x="320" y="78" text-anchor="middle">KOSHISHEIN</text>
  </g>
  <path class="wave" d="M75 58C111 37 147 37 183 58S255 79 291 58S363 37 399 58S471 79 507 58S543 43 565 58"/>
</svg>
